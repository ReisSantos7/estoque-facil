<div><label for="inicio">Movimento a partir de</label><input type="date" id="inicio" name="inicio" value="{{ f.inicio|default('') }}"></div><div><label for="fim">Até</label><input type="date" id="fim" name="fim" value="{{ f.fim|default('') }}"></div><div><label for="produto">Produto</label><select id="produto" name="produto"><option value="">Todos os produtos</option>{% for p in produtos %}<option value="{{ p.CODPROD }}" {{ 'selected' if f.produto==p.CODPROD|string else '' }}>{{ p.CODPROD }} — {{ p.DESCRPROD }}</option>{% endfor %}</select></div><div><label for="tipmov">Tipo de movimento</label><select id="tipmov" name="tipmov"><option value="">Todos</option>{% for k,v in tipos.items() %}{% if not portal or (portal=='compras' and k in ['C','O']) or (portal=='vendas' and k in ['V','P']) %}<option value="{{ k }}" {{ 'selected' if f.tipmov==k else '' }}>{{ k }} — {{ v }}</option>{% endif %}{% endfor %}</select></div><div><label for="top">Tipo de operação</label><input id="top" name="top" type="number" min="1" max="99999" value="{{ f.top|default('') }}" placeholder="Código da TOP"></div>
