{% extends 'base.html' %}{% block content %}<a class="back" href="{{ url_for('index') }}">← Produtos</a><div class="eyebrow">CADASTRO DE PRODUTOS</div><h1>{{ 'Editar produto' if editar else 'Novo produto' }}</h1><p>Todos os campos são obrigatórios. O código identifica o produto.</p><form class="panel productform" method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><div class="grid"><div><label for="codigo">Código do produto</label><input id="codigo" name="CODPROD" type="number" min="1" max="9999999999" step="1" required value="{{ produto.CODPROD|default('') }}" {{ 'readonly' if editar else '' }}></div><div><label for="unidade">Unidade</label><select id="unidade" name="CODVOL" required><option value="">Selecione</option>{% for u in unidades %}<option value="{{ u.CODVOL }}" {{ 'selected' if produto.CODVOL==u.CODVOL else '' }}>{{ u.CODVOL }} — {{ u.DESCRVOL }}</option>{% endfor %}</select></div><div class="full"><label for="descricao">Descrição do produto</label><input id="descricao" name="DESCRPROD" maxlength="100" required value="{{ produto.DESCRPROD|default('') }}" placeholder="Ex.: Café torrado 500 g"></div><div><label for="grupo">Grupo de produtos</label><select id="grupo" name="CODGRUPOPROD" required>{% for g in grupos %}<option value="{{ g.CODGRUPOPROD }}" {{ 'selected' if produto.CODGRUPOPROD|default(1)|string==g.CODGRUPOPROD|string else '' }}>{{ g.CODGRUPOPROD }} — {{ g.DESCRGRUPOPROD }}</option>{% endfor %}</select><small><a href="{{ url_for('grupos',aba='cadastro') }}">Cadastrar um grupo</a></small></div><div><label for="minimo">Estoque mínimo</label><input id="minimo" name="ESTMIN" inputmode="decimal" required value="{{ produto.ESTMIN|default('0') }}"><small>Até 3 casas decimais. Não é o saldo atual.</small></div></div><div class="actions"><button>{{ 'Salvar alterações' if editar else 'Cadastrar produto' }}</button><a class="secondary" href="{{ url_for('index') }}">Cancelar</a></div></form>{% endblock %}
